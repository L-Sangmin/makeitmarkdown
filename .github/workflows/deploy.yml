# Deploy /public to Cloudflare Pages.
#
# Preferred path (zero config): connect this repo in the Cloudflare Pages
# dashboard (build command: none, output directory: public). In that case
# this workflow is redundant and can be deleted.
#
# Alternative (direct upload): keep this workflow and set the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets.

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=makeitmarkdown
