<!doctype html>
<html lang="en">
<head>

    try {
      const t = localStorage.getItem("mim-theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch {}

</head>

  <main style="display:grid;place-content:center;text-align:center;padding:4rem 1.5rem;gap:0.75rem">
    <p style="font-family:var(--font-mono);font-size:0.75rem;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-faint);margin:0">404 &middot; not found</p>

    <p style="margin:0;max-width:26rem;color:var(--fg-muted);font-size:0.9375rem;line-height:1.6">
      The address may have changed, or the link was wrong.
      Everything on this site is reachable from these three places:
    </p>
    <p style="margin:0.5rem 0 0;display:flex;gap:1.25rem;justify-content:center;flex-wrap:wrap">
      <a href="/" style="color:var(--accent)">Open the converter &rarr;</a>
      <a href="/formats/" style="color:var(--accent)">Format guides &rarr;</a>
      <a href="/blog/" style="color:var(--accent)">Context Lab &rarr;</a>
    </p>
  </main>
</body>
</html>
